<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><rect width="960" height="290" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#566275"/></marker></defs><text x="20" y="30" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#435063">OLD SHAPE</text><rect x="20" y="46" width="220" height="54" rx="10" fill="#edf4f6"/><text x="36" y="68" font-size="14" font-weight="600" fill="#18222c">Area A</text><text x="36" y="88" font-size="12" fill="#435063">its own reviews, rituals, channels</text><rect x="20" y="112" width="220" height="54" rx="10" fill="#edf4f6"/><text x="36" y="134" font-size="14" font-weight="600" fill="#18222c">Area B</text><text x="36" y="154" font-size="12" fill="#435063">its own reviews, rituals, channels</text><rect x="20" y="178" width="220" height="54" rx="10" fill="#edf4f6"/><text x="36" y="200" font-size="14" font-weight="600" fill="#18222c">Area C</text><text x="36" y="220" font-size="12" fill="#435063">its own reviews, rituals, channels</text><rect x="330" y="46" width="200" height="186" rx="12" fill="#e4f76b"/><text x="430" y="104" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#18222c">ONE DAY</text><text x="430" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#18222c">Every routine</text><text x="430" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#18222c">rebuilt</text><text x="430" y="184" text-anchor="middle" font-size="12" fill="#18222c">nothing runs on the old shape</text><path d="M240 139H326" stroke="#566275" stroke-width="2" fill="none" marker-end="url(#a)" /><path d="M530 139H616" stroke="#566275" stroke-width="2" fill="none" marker-end="url(#a)" /><text x="620" y="30" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#435063">NEW SHAPE</text><rect x="620" y="46" width="320" height="54" rx="10" fill="#e3e9f7"/><text x="636" y="79" font-size="14" font-weight="600" fill="#18222c">Area 1</text><rect x="620" y="112" width="320" height="54" rx="10" fill="#e3e9f7"/><text x="636" y="145" font-size="14" font-weight="600" fill="#18222c">Area 2</text><rect x="620" y="178" width="320" height="54" rx="10" fill="#fff" stroke="#cfd8e2"/><text x="636" y="200" font-size="13" font-weight="600" fill="#18222c">One shared operating rhythm</text><text x="636" y="220" font-size="12" fill="#435063">five named priorities, posted weekly everywhere</text><path d="M130 238C130 275 780 275 780 238" stroke="#b9c3cf" stroke-width="2" stroke-dasharray="6 6" fill="none"/><text x="455" y="282" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#566275">NOT THIS: OLD ROUTINES RUNNING UNDER THE NEW CHART</text><path d="M440 252L470 272M470 252L440 272" stroke="#b44" stroke-width="2"/></svg>
